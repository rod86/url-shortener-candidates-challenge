services:
  web:
    container_name: url-shortener.web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - postgres
    networks:
      - local

  postgres:
    image: postgres:18.4-alpine
    container_name: url-shortener.postgres
    restart: no
    environment:
      POSTGRES_USER: '${DATABASE_USER}'
      POSTGRES_PASSWORD: '${DATABASE_PASSWORD}'
      POSTGRES_DB: '${DATABASE_DB}'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - local

volumes:
  postgres_data:

networks:
  local: